name: Daily watcher

# Scrapes the field every morning (free: public feeds, no paid APIs).
# Publishes only when the significance gate finds something worth a signal,
# plus a weekly refresh of the trend radar on Sundays.
on:
  schedule:
    - cron: '17 11 * * *' # 11:17 UTC daily
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy the site after this run even if nothing new was published'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    env:
      HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Zero-spend guard
        # The watcher must never be able to bill anyone. If a pay-per-use API
        # key exists as a repository secret, refuse to run at all.
        env:
          PAID_1: ${{ secrets.ANTHROPIC_API_KEY }}
          PAID_2: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$PAID_1$PAID_2" ]; then
            echo "::error::A pay-per-use API key secret exists in this repository. The watcher refuses to run so it can never spend money. Delete the ANTHROPIC_API_KEY / OPENAI_API_KEY secret; the watcher uses only your Claude subscription token (CLAUDE_CODE_OAUTH_TOKEN)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Scrape sources
        run: npm run watch:scrape

      - name: Significance gate
        id: gate
        run: npm run watch:gate

      - name: Editor (Claude, via subscription)
        if: steps.gate.outputs.has_candidates == 'true' && env.HAS_CLAUDE == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          # Subscription OAuth token only. No API key is ever passed.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Follow the instructions in scripts/watch/JUDGE_PROMPT.md exactly. Today's date is the date in data/watch/candidates.json.
          claude_args: |
            --model sonnet
            --max-turns 30
            --allowedTools Read,Write,Glob,Grep,WebFetch

      - name: Heuristic fallback (no Claude token configured)
        if: steps.gate.outputs.has_candidates == 'true' && env.HAS_CLAUDE != 'true'
        run: npm run watch:publish-heuristic

      - name: Validate new signals
        run: node scripts/watch/validate-signals.mjs --new

      - name: Refresh attributed media previews
        run: npm run watch:media

      - name: Decide whether to deploy
        id: decide
        run: |
          NEW=$(git status --porcelain src/content/signals | wc -l | tr -d ' ')
          MEDIA=$(git status --porcelain data/watch/media.json | wc -l | tr -d ' ')
          DOW=$(date -u +%u)
          if [ "$NEW" -gt 0 ] || [ "$MEDIA" -gt 0 ] || [ "$DOW" = "7" ] || [ "${{ inputs.deploy }}" = "true" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
          echo "New signals: $NEW"
          echo "Media catalog changed: $MEDIA"

      - name: Commit watcher data and signals
        run: |
          git config user.name "whatisai-watcher"
          git config user.email "watcher@users.noreply.github.com"
          git add data/watch src/content/signals
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "watcher: $(date -u +%F)"
            git push origin HEAD:main
          fi

  deploy:
    needs: watch
    if: needs.watch.outputs.deploy == 'true'
    uses: ./.github/workflows/deploy.yml
